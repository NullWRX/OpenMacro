# Single source of truth for the app version (MAJOR.MINOR.PATCH, shown as vMAJOR.MINOR.PATCH).
# Bump PATCH for fixes, MINOR for features, MAJOR for breaking or milestone releases.
# versionCode is derived as MAJOR * 10000 + MINOR * 100 + PATCH, so MINOR and PATCH stay below 100.
VERSION_MAJOR=0
VERSION_MINOR=1
VERSION_PATCH=0
