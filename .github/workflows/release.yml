name: Release

# Publishes a GitHub release with APKs for the version in version.properties.
# Runs when version.properties changes on main (a version bump), when a vX.Y.Z tag is pushed,
# or by hand. A version that already has a release is skipped, so re-runs are harmless.
on:
  push:
    branches: [main]
    paths:
      - version.properties
      - .github/workflows/release.yml
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./version.properties
          tag="v${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version.properties ($tag)" >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.skip != 'true'

      - name: Decode signing key
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.OM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "OM_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key configured; release APKs will be signed with a debug key."
          fi

      - name: Test and build release APKs
        if: steps.version.outputs.skip != 'true'
        env:
          OM_KEYSTORE_PASSWORD: ${{ secrets.OM_KEYSTORE_PASSWORD }}
          OM_KEY_ALIAS: ${{ secrets.OM_KEY_ALIAS }}
          OM_KEY_PASSWORD: ${{ secrets.OM_KEY_PASSWORD }}
        run: .github/scripts/gradle.sh :core:test testPlayReleaseUnitTest assemblePlayRelease assembleFdroidRelease

      - name: Collect APKs and release notes
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/*/release/*.apk; do
            flavor=$(basename "$(dirname "$(dirname "$apk")")")
            cp "$apk" "dist/OpenMacro-${TAG}-${flavor}.apk"
          done
          # The CHANGELOG section for this version becomes the release notes.
          awk -v v="${TAG#v}" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          cat >> dist/notes.md <<'NOTES'

          ### Which APK?
          - **play**: barcode and nutrition-label scanning (uses Google's on-device ML Kit).
          - **fdroid**: free software only; barcode scanning, no label scanning yet.
          NOTES
          sed -i 's/^          //' dist/notes.md
          ls -l dist

      - name: Publish GitHub release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OpenMacro ${{ steps.version.outputs.tag }}
          files: dist/*.apk
          body_path: dist/notes.md
          prerelease: ${{ startsWith(steps.version.outputs.tag, 'v0.') }}
