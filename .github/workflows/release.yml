name: Release

# Publishes a GitHub release with APKs for the version in version.properties.
# Runs when version.properties changes on main (a version bump), when a vX.Y.Z tag is pushed,
# or by hand. A version that already has a release is skipped, so re-runs are harmless.
on:
  push:
    branches: [main]
    paths:
      - version.properties
      - .github/workflows/release.yml
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./version.properties
          tag="v${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version.properties ($tag)" >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.skip != 'true'

      - name: Unlock signing key
        if: steps.version.outputs.skip != 'true'
        env:
          SIGNING_PASSWORD: ${{ secrets.OM_SIGNING_PASSWORD }}
        run: |
          # The release key lives encrypted in signing/; one secret unlocks it. Every release must
          # use this same key, or phones refuse to install it as an update, so never fall back.
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error title=Signing key locked::Add the OM_SIGNING_PASSWORD repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          PW="$SIGNING_PASSWORD" openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in signing/openmacro-release.p12.enc -out "$RUNNER_TEMP/release.p12" -pass env:PW
          {
            echo "OM_KEYSTORE_PATH=$RUNNER_TEMP/release.p12"
            echo "OM_KEY_ALIAS=openmacro"
          } >> "$GITHUB_ENV"

      - name: Test and build release APKs
        if: steps.version.outputs.skip != 'true'
        env:
          OM_KEYSTORE_PASSWORD: ${{ secrets.OM_SIGNING_PASSWORD }}
          OM_KEY_PASSWORD: ${{ secrets.OM_SIGNING_PASSWORD }}
        run: .github/scripts/gradle.sh :core:test testPlayReleaseUnitTest assemblePlayRelease assembleFdroidRelease

      - name: Check the APKs carry the release certificate
        if: steps.version.outputs.skip != 'true'
        run: |
          expected="0ea58137060a5fa566c33977e315a09692775c852ac8b07af70e5810fe25ace3"
          for apk in app/build/outputs/apk/*/release/*.apk; do
            got=$(python3 .github/scripts/apk_cert.py "$apk")
            echo "$apk -> $got"
            if [ "$got" != "$expected" ]; then
              echo "::error title=Wrong signing key::$apk is signed with $got, not the release key."
              exit 1
            fi
          done

      - name: Collect APKs and release notes
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/*/release/*.apk; do
            flavor=$(basename "$(dirname "$(dirname "$apk")")")
            cp "$apk" "dist/OpenMacro-${TAG}-${flavor}.apk"
          done
          # The CHANGELOG section for this version becomes the release notes.
          awk -v v="${TAG#v}" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          cat >> dist/notes.md <<'NOTES'

          ### Which APK?
          - **play**: barcode and nutrition-label scanning (uses Google's on-device ML Kit).
          - **fdroid**: free software only; barcode scanning, no label scanning yet.
          NOTES
          sed -i 's/^          //' dist/notes.md
          ls -l dist

      - name: Publish GitHub release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OpenMacro ${{ steps.version.outputs.tag }}
          files: dist/*.apk
          body_path: dist/notes.md
          prerelease: ${{ startsWith(steps.version.outputs.tag, 'v0.') }}
