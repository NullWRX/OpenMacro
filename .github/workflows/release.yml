name: Release

# Push a tag like v0.1.0 to publish a GitHub release with signed (or unsigned) APKs.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches version.properties
        run: |
          . ./version.properties
          expected="v${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version.properties ($expected)" >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "OM_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key configured; release APKs will be unsigned."
          fi

      - name: Test and build release APKs
        env:
          OM_KEYSTORE_PASSWORD: ${{ secrets.OM_KEYSTORE_PASSWORD }}
          OM_KEY_ALIAS: ${{ secrets.OM_KEY_ALIAS }}
          OM_KEY_PASSWORD: ${{ secrets.OM_KEY_PASSWORD }}
        run: .github/scripts/gradle.sh :core:test testPlayReleaseUnitTest assemblePlayRelease assembleFdroidRelease

      - name: Collect APKs and release notes
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/*/release/*.apk; do
            flavor=$(basename "$(dirname "$(dirname "$apk")")")
            cp "$apk" "dist/OpenMacro-${GITHUB_REF_NAME}-${flavor}$( [[ "$apk" == *unsigned* ]] && echo -unsigned ).apk"
          done
          # The CHANGELOG section for this version becomes the release notes.
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          ls -l dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: dist/notes.md
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
