name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: .github/scripts/gradle.sh :core:test testPlayDebugUnitTest testFdroidDebugUnitTest

      - name: Build debug APKs (Play and F-Droid flavors)
        if: success() || failure()
        run: .github/scripts/gradle.sh assemblePlayDebug assembleFdroidDebug

      - name: Lint
        run: .github/scripts/gradle.sh lintPlayDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: openmacro-debug-apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports/
            app/build/reports/
          retention-days: 14
